tools:
  - name: search_pointcloud_terrain
    description: List bounded USGS 3DEP lidar point cloud tile candidates for a WGS84 bounding box.
    source_file: scripts/search_pointcloud_terrain.py
    execution: sync
    affinity: any
    timeout_hint_secs: 180
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    group: geospatial
    input_schema:
      type: object
      required: [south, west, north, east]
      properties:
        south: {type: number, minimum: -90, maximum: 90}
        west: {type: number, minimum: -180, maximum: 180}
        north: {type: number, minimum: -90, maximum: 90}
        east: {type: number, minimum: -180, maximum: 180}
        endpoint: {type: string, format: uri, default: "https://tnmaccess.nationalmap.gov/api/v1/products"}
    output_schema:
      type: object
      required: [bbox, count, candidates]
      properties:
        bbox: {type: array, minItems: 4, maxItems: 4, items: {type: number}}
        count: {type: integer, minimum: 0}
        candidates:
          type: array
          items:
            type: object
            required: [title, source_id, download_url]
            properties:
              title: {type: string}
              source_id: {type: string}
              download_url: {type: string}

  - name: download_pointcloud_terrain
    description: Download one bounded USGS 3DEP lidar point cloud tile and return an attributed AssetDescriptor.
    source_file: scripts/pointcloud_terrain.py
    execution: sync
    affinity: any
    timeout_hint_secs: 900
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: geospatial
    input_schema:
      type: object
      required: [south, west, north, east, output_dir]
      properties:
        south: {type: number, minimum: -90, maximum: 90}
        west: {type: number, minimum: -180, maximum: 180}
        north: {type: number, minimum: -90, maximum: 90}
        east: {type: number, minimum: -180, maximum: 180}
        output_dir: {type: string, minLength: 1}
        source_id: {type: string, default: ""}
        index: {type: integer, minimum: 0, default: 0}
        endpoint: {type: string, format: uri, default: "https://tnmaccess.nationalmap.gov/api/v1/products"}
    output_schema:
      type: object
      required: [asset_descriptor]
      properties:
        asset_descriptor:
          type: object
          required: [asset_id, variants, attribution]
          properties:
            asset_id: {type: string}
            variants:
              type: array
              minItems: 1
              items:
                type: object
                required: [local_path, format]
            attribution:
              type: object
              required: [source_url, license_spdx, author, attribution_text]
