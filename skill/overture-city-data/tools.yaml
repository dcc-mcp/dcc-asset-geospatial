tools:
  - name: download_overture_city_data
    description: Download one bounded Overture Maps city feature type as attributed GeoJSON.
    source_file: scripts/download_overture_city_data.py
    execution: sync
    affinity: any
    timeout_hint_secs: 600
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: geospatial
    input_schema:
      type: object
      required: [feature_type, south, west, north, east, output_dir]
      properties:
        feature_type:
          type: string
          enum: [building, segment, connector, infrastructure, land, land_cover, water]
        south: {type: number, minimum: -90, maximum: 90}
        west: {type: number, minimum: -180, maximum: 180}
        north: {type: number, minimum: -90, maximum: 90}
        east: {type: number, minimum: -180, maximum: 180}
        output_dir: {type: string, minLength: 1}
    output_schema:
      type: object
      required: [asset_descriptor]
      properties:
        asset_descriptor:
          type: object
          required: [asset_id, variants, attribution]
          properties:
            asset_id: {type: string}
            variants:
              type: array
              minItems: 1
              items:
                type: object
                required: [local_path, format]
            attribution:
              type: object
              required: [source_url, license_spdx, author, attribution_text]
