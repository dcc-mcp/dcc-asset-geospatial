tools:
  - name: download_osm_city_data
    description: Query bounded OpenStreetMap city layers through Overpass and write attributed GeoJSON.
    source_file: scripts/download_osm_city_data.py
    execution: sync
    affinity: any
    timeout_hint_secs: 180
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: geospatial
    input_schema:
      type: object
      required: [south, west, north, east, output_dir]
      properties:
        south: {type: number, minimum: -90, maximum: 90}
        west: {type: number, minimum: -180, maximum: 180}
        north: {type: number, minimum: -90, maximum: 90}
        east: {type: number, minimum: -180, maximum: 180}
        output_dir: {type: string, minLength: 1}
        layers:
          type: array
          uniqueItems: true
          default: [buildings, roads, railways, water, landuse]
          items:
            type: string
            enum: [buildings, roads, railways, water, landuse]
        endpoint: {type: string, format: uri, default: "https://overpass-api.de/api/interpreter"}
    output_schema:
      type: object
      required: [asset_descriptor]
      properties:
        asset_descriptor:
          type: object
          required: [asset_id, variants, attribution]
          properties:
            asset_id: {type: string}
            variants:
              type: array
              minItems: 1
              items:
                type: object
                required: [local_path, format]
            attribution:
              type: object
              required: [source_url, license_spdx, author, attribution_text]
